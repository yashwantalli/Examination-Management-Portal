{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="mb-3">My Profile</h4>
            <ul class="list-group list-group-flush mb-4">
                <li class="list-group-item d-flex justify-content-between">
                    <span class="text-muted">Username</span>
                    <strong>{{ current_user.username }}</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span class="text-muted">Role</span>
                    <span class="badge bg-primary text-uppercase">{{ current_user.role }}</span>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span class="text-muted">Account Status</span>
                    <span class="badge bg-{{ 'success' if current_user.is_approved else 'warning' }}">
                        {{ 'Approved' if current_user.is_approved else 'Pending Approval' }}
                    </span>
                </li>
            </ul>

            <h6>Change Password</h6>
            <form method="POST">
                <div class="mb-3">
                    <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                </div>
                <button class="btn btn-dark btn-sm">Update Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
