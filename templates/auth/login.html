{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card mx-auto mt-md-4"><div class="card-body p-4">
  <h1 class="h4 mb-1">Log in</h1>
  <p class="text-body-secondary small mb-4">Admins, examiners and students all sign in here.</p>
  <form method="post" novalidate>
    {{ csrf() }}
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" required autofocus autocomplete="username">
    </div>
    <div class="mb-4">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
    </div>
    <button class="btn btn-primary w-100">Log in</button>
  </form>
  <p class="small text-center mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Register as a student</a> or <a href="{{ url_for('auth.register', role='examiner') }}">as an examiner</a>.</p>
</div></div>
{% endblock %}
