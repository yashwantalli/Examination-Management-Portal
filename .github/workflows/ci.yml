name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests (SQLite, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  test-postgres:
    name: Tests + migrations (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emp
          POSTGRES_PASSWORD: emp
          POSTGRES_DB: emp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emp -d emp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://emp:emp@localhost:5432/emp_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Full test suite, including concurrency tests
        run: python -m pytest -q
      - name: Migrations apply to an empty database and match the models
        env:
          PGPASSWORD: emp
          EMP_AUTO_CREATE_TABLES: "0"
          DATABASE_URL: postgresql://emp:emp@localhost:5432/emp_migrate
        run: |
          psql -h localhost -U emp -d emp_test -c "CREATE DATABASE emp_migrate"
          flask --app app db upgrade
          flask --app app db check

  docker:
    name: Docker build and boot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create a throwaway .env
        run: |
          {
            echo "POSTGRES_PASSWORD=ci$(openssl rand -hex 8)"
            echo "EMP_SECRET_KEY=$(openssl rand -hex 32)"
            echo "EMP_ADMIN_PASSWORD=Ci-$(openssl rand -hex 8)-Aa1"
          } > .env
      - name: Build and start the stack, waiting for healthchecks
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Health endpoint answers
        run: curl -fsS http://localhost:8000/health
      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --no-color
      - run: docker compose down -v
        if: always()
